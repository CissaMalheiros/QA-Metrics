name: Verificações
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: qa_metrics
          POSTGRES_PASSWORD: ci-local-only
          POSTGRES_DB: qa_metrics_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U qa_metrics -d qa_metrics_test"
          --health-interval 5s --health-timeout 5s --health-retries 15
    env:
      DATABASE_URL: postgresql://qa_metrics:ci-local-only@localhost:5432/qa_metrics_test
      TEST_DATABASE_URL: postgresql://qa_metrics:ci-local-only@localhost:5432/qa_metrics_test
      BETTER_AUTH_URL: http://localhost:3000
      BETTER_AUTH_SECRET: qa-metrics-ci-only-secret-for-ephemeral-test-environment
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:integration
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-diagnostics
          path: |
            playwright-report/
            test-results/
          retention-days: 7
